  <text x="72" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#2B2136" letter-spacing="1">PRIYANK SAXENA</text>
  <text x="76" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" font-weight="400" fill="#7C7489">final-year cs student &amp;</text>
